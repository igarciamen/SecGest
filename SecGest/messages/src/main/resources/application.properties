spring.application.name=messages
server.port=8086

# PostgreSQL BBDD (misma instancia que el resto, base de datos propia)
spring.datasource.url=jdbc:postgresql://localhost:5432/messagesSecGest
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:apertura15}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

jwt.secret=${JWT_SECRET:0123456789ABCDEFGHIJKLMNOPQRSTUV}

# URL base del microservicio "tasks" (RestTemplate, ver TaskClient).
tasks.base-url=http://localhost:8082/api/tasks


app.cors.allowed-origins=http://localhost:4200