spring.application.name=tasks
server.port=8082

# PostgreSQL BBDD (misma instancia de Postgres que usa "users", base de datos distinta)
spring.datasource.url=jdbc:postgresql://localhost:5432/tasksSecGest
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:apertura15}

# Configuracion de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# Mismo secreto JWT que el microservicio users: asi valida sus tokens sin llamarlo.
jwt.secret=${JWT_SECRET:0123456789ABCDEFGHIJKLMNOPQRSTUV}

# URL base del microservicio "categories" (RestTemplate, ver CategoryClient).
categories.base-url=http://localhost:8083/api/categories

# URL base del microservicio "users" (RestTemplate, ver UserClient). Usa /api/user
# (sin barra final) porque UserClient anade "/" + id.
users.base-url=http://localhost:8081/api/user

# URL base del microservicio "notifications" (RestTemplate, ver EmailClient).
notifications.base-url=http://localhost:8084

# --- TPV Redsys (BBVA usa esta misma plataforma por debajo) ---
# ESTE ES EL COMERCIO DE PRUEBAS PUBLICO que el propio Redsys facilita a
# cualquier desarrollador para integrar y probar SIN tener un contrato real con
# un banco. No es una cuenta de BBVA real, ni se puede cobrar dinero de verdad
# con estas credenciales -- es exactamente el punto de partida correcto para un
# TFG. Cuando la agencia tenga un contrato real con BBVA, solo habria que
# sustituir estos tres valores por los que facilite el banco.
redsys.merchant-code=999008881
redsys.terminal=1
redsys.secret-key=${REDSYS_SECRET_KEY:sq7HjrUOBfKmC576ILgskD5srU870gJ7}
redsys.currency=978
redsys.gateway-url=https://sis-t.redsys.es:25443/sis/realizarPago
redsys.url-ok=http://localhost:4200/payment/ok
redsys.url-ko=http://localhost:4200/payment/ko
# Redsys llama a esta URL desde SUS servidores para confirmar el pago -- en
# localhost es inalcanzable desde fuera. Para probarlo de verdad hace falta
# exponerla con ngrok (ver la guia de este bloque) y sustituir este valor por
# la URL publica temporal que ngrok genere.
redsys.notify-url=https://landed-copartner-quaintly.ngrok-free.dev/api/tasks/payments/redsys/notify

app.cors.allowed-origins=http://localhost:4200