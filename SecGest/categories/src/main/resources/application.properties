spring.application.name=categories
server.port=8083

# PostgreSQL BBDD (misma instancia que usa "users"/"tasks", base de datos propia)
spring.datasource.url=jdbc:postgresql://localhost:5432/categoriesSecGest
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:apertura15}

# Configuracion de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# Mismo secreto JWT que "users" y "tasks": asi valida sus tokens sin llamar a users.
jwt.secret=${JWT_SECRET:0123456789ABCDEFGHIJKLMNOPQRSTUV}

app.cors.allowed-origins=http://localhost:4200
