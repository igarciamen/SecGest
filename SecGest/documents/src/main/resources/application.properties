spring.application.name=documents
server.port=8085

# PostgreSQL BBDD (misma instancia de Postgres que el resto, base de datos propia)
spring.datasource.url=jdbc:postgresql://localhost:5432/documentsSecGest
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:apertura15}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# Mismo secreto JWT que el resto de microservicios.
jwt.secret=${JWT_SECRET:0123456789ABCDEFGHIJKLMNOPQRSTUV}

# URL base del microservicio "tasks" (RestTemplate, ver TaskClient).
tasks.base-url=http://localhost:8082/api/tasks

# Carpeta local donde se guardan los ficheros subidos (fuera del proyecto, para
# que no se borre al hacer clean/rebuild). Se crea sola si no existe.
documents.storage-path=./secregest-uploads

# Limite de tamano de subida a nivel de servidor (ademas de la validacion propia
# en DocumentService, que da un mensaje de error mas claro que el generico de Spring).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.cors.allowed-origins=http://localhost:4200
